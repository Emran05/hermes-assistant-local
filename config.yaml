# ~/.hermes/config.yaml — the seed install.sh copies onto a fresh Mac (only when
# there is no config yet; it never overwrites one).
#
# Every key here is one Hermes Agent 0.18 actually reads. Change values with
# `hermes config set <key> <value>` rather than by hand. Secrets live in
# ~/.hermes/.env (see env.example), NOT in this file.
#
# `python3 dashboard/doctor.py` holds this file against the keys that keep the
# agent local and gated (the "Hermes config drift" line) and names the command
# for anything it flags. It never edits it.

# ---------------------------------------------------------------------------
# MODEL — the local MLX server (mlx-server.sh, OpenAI-compatible, on demand).
# The dashboard's model menu rewrites model.default when you switch models.
# No api_key: Hermes sends a placeholder to a custom endpoint that has none.
# ---------------------------------------------------------------------------
model:
  default: mlx-community/Qwen3.8-27B-4bit
  provider: custom
  base_url: http://127.0.0.1:8080/v1
  context_length: 65536             # Hermes requires >= 64k; keep the KV cache sane

# The optional background lane (mlx-server-bg.sh, :8081). The dashboard sends
# its briefing / watchtower one-shots here with `--provider custom:bg` while
# that lane is up. Nothing starts it for you — see the README.
custom_providers:
  - name: bg
    base_url: http://127.0.0.1:8081/v1
    model: mlx-community/Qwen3.5-9B-4bit
    context_length: 65536

# Side tasks (summarisation, the smart-approval reviewer) run on the SAME local
# model, so a key you add later for something else never pulls them off the Mac.
auxiliary:
  compression:
    provider: main
  approval:
    provider: main

# ---------------------------------------------------------------------------
# SAFETY — pinned here, not left to upstream defaults that move between releases
# ---------------------------------------------------------------------------
approvals:
  mode: manual                      # you approve dangerous commands (0.19+ defaults to "smart")
  cron_mode: deny                   # scheduled jobs never auto-approve

agent:
  max_turns: 60                     # 0.18 defaults to 90, 0.20+ to 500

# text_to_speech defaults to Microsoft Edge's cloud voices when this is unset.
# piper synthesises on the Mac; until piper-tts is installed in the agent's
# venv the tool returns an error instead of reaching the cloud.
tts:
  provider: piper

# ---------------------------------------------------------------------------
# DISPLAY — what you see in Telegram
# ---------------------------------------------------------------------------
display:
  tool_progress: "new"              # brief one-liners as tools fire; not full logs
  tool_progress_command: true       # lets you /verbose from Telegram
  runtime_footer:
    enabled: false
  platforms:
    telegram:
      tool_progress: "new"

# ---------------------------------------------------------------------------
# CONTEXT COMPRESSION — keeps long always-on sessions from blowing context
# ---------------------------------------------------------------------------
compression:
  enabled: true
  threshold: 0.70
  target_ratio: 0.25
  protect_last_n: 20
  protect_first_n: 3

# ---------------------------------------------------------------------------
# MESSAGING GATEWAY — Telegram only, locked to you.
# Token + allowed users come from .env (TELEGRAM_BOT_TOKEN / TELEGRAM_ALLOWED_USERS).
# ---------------------------------------------------------------------------
platforms:
  telegram:
    enabled: true
    # allowlist is read from TELEGRAM_ALLOWED_USERS in .env — keep it to YOUR id
    extra:
      command_menu:
        max_commands: 60
        priority_mode: prepend
        priority:
          - approve
          - deny
          - verbose

# ---------------------------------------------------------------------------
# NOT seeded, on purpose
# ---------------------------------------------------------------------------
# * No MCP servers. Google is connected through the dashboard (Settings ›
#   Connections), which never requests a send-capable Gmail scope. An entry
#   under `mcp_servers:` is enabled by default, starts its own process (an
#   `npx` one is downloaded from npm at start) and, unless you set
#   `sampling: {enabled: false}`, may ask this model for completions. The
#   doctor's drift check lists every enabled one.
# * No scheduled jobs. The morning brief, midday pulse and evening wrap come
#   from the dashboard (Settings › Proactive). Hermes' own scheduler keeps its
#   jobs in ~/.hermes/cron/jobs.json (`hermes cron`), not in this file.
