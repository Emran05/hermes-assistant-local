name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Syntax + hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every Python file
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.py')
          printf '%s\n' "${files[@]}"
          python3 -m py_compile "${files[@]}"

      - name: Parse every shell script
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            echo "bash -n $f"
            bash -n "$f" || rc=1
          done < <(git ls-files '*.sh')
          exit $rc

      - name: Parse every dashboard JavaScript file
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            case "$f" in dashboard/motion.min.js) echo "skip  $f"; continue ;; esac
            echo "node --check $f"
            node --check "$f" || rc=1
          done < <(git ls-files 'dashboard/*.js')
          exit $rc

      # A home directory path in a tracked file means the tree only works on one
      # person's Mac (and leaks their username). Placeholders are fine.
      - name: No personal home paths in tracked files
        run: |
          set -uo pipefail
          hits="$(git grep -InE '/Users/[A-Za-z0-9._-]+' -- . ':!.github/workflows/ci.yml' \
                  | grep -vE '/Users/(YOU|you|USER|username|me|<[^>]+>|\$[A-Za-z_{])' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a personal home path is committed — use \$HOME or ~ instead"
            exit 1
          fi
          echo "clean"

      - name: VERSION is a semver
        run: |
          set -euo pipefail
          v="$(tr -d ' \t\n\r' < VERSION)"
          echo "VERSION = $v"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::VERSION must look like 1.2.3"; exit 1; }

  unit-tests:
    name: Unit tests (macOS, Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The owner's own Mac (and its dashboard) runs Python 3.14 — see
        # CLAUDE.md — so CI must cover the version actually in use, not
        # whatever was newest when this file was written. 3.13 stays in the
        # matrix as the previous stable series; drop it once 3.14 has been
        # green here for a while. Confirmed both are published in
        # actions/setup-python's version manifest as of this writing.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # run.sh's own model-wake guard only compares before/after WITHIN one
      # run.sh invocation, so a runner that somehow already had a lane
      # resident (a leftover from something else on a self-hosted box, say)
      # would still read as "unchanged" if a test left it running too.
      # Snapshot it here as an independent, job-level check.
      - name: Snapshot model processes before the run
        run: |
          set -uo pipefail
          before="$(pgrep -f 'mlx-vlm-launch|mlx_lm server' | tr '\n' ' ')"
          echo "MODELS_BEFORE=$before" >> "$GITHUB_ENV"
          if [ -n "$before" ]; then
            echo "::error::a model server is already resident before the run started"
            pgrep -fl 'mlx-vlm-launch|mlx_lm server'
            exit 1
          fi
          echo "clean (before)"

      # The unit tier is the only tier that may run here: it stubs the dashboard
      # modules against throwaway HOMEs, and run.sh loads an offline guard that
      # refuses the dashboard / model / serve ports for the whole tier, so a
      # suite that quietly needed the owner's running Mac fails instead of
      # passing by accident.  live/, browser/ and ac/ need a real machine.
      # HERMES_TESTS_STRICT=1 makes a missing offline guard a hard failure
      # instead of a warning — GitHub Actions already sets CI=true, which
      # run.sh treats the same way, but this is explicit in case that ever
      # changes or the job runs somewhere else.
      - name: Run the unit tier
        env:
          HERMES_TESTS_STRICT: "1"
        run: |
          set -euo pipefail
          node --version
          python3 --version
          tools/tests/run.sh unit

      - name: No model server was started
        run: |
          set -uo pipefail
          after="$(pgrep -f 'mlx-vlm-launch|mlx_lm server' | tr '\n' ' ')"
          before="${MODELS_BEFORE:-}"
          if [ "$after" != "$before" ]; then
            echo "::error::a model server's presence changed during the run (before=[${before:-none}] after=[${after:-none}])"
            pgrep -fl 'mlx-vlm-launch|mlx_lm server' || true
            exit 1
          fi
          echo "clean"
