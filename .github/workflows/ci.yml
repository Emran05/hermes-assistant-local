name: CI

on:
  push:
  pull_request:
  # release.yml calls this whole workflow as a required job before it builds,
  # signs or publishes anything (B30), so a tag can never ship a tree that
  # fails these checks.
  workflow_call:

permissions:
  contents: read

jobs:
  static-checks:
    name: Syntax + hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every Python file
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.py')
          printf '%s\n' "${files[@]}"
          python3 -m py_compile "${files[@]}"

      - name: Parse every shell script
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            echo "bash -n $f"
            bash -n "$f" || rc=1
          done < <(git ls-files '*.sh')
          exit $rc

      - name: Parse every dashboard JavaScript file
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            echo "node --check $f"
            node --check "$f" || rc=1
          done < <(git ls-files 'dashboard/*.js')
          exit $rc

      # index.html's inline <script> is the whole app shell (~140 KB); the step
      # above only sees the .js files, so a syntax error there used to pass CI
      # and blank the UI (C85).
      - name: Parse every inline script in the HTML
        run: |
          set -euo pipefail
          python3 tools/tests/lib/check_inline_scripts.py

      # A home directory path in a tracked file means the tree only works on one
      # person's Mac (and leaks their username). Placeholders are fine.
      - name: No personal home paths in tracked files
        run: |
          set -uo pipefail
          hits="$(git grep -InE '/Users/[A-Za-z0-9._-]+' -- . ':!.github/workflows/ci.yml' \
                  | grep -vE '/Users/(YOU|you|USER|username|me|<[^>]+>|\$[A-Za-z_{])' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a personal home path is committed — use \$HOME or ~ instead"
            exit 1
          fi
          echo "clean"

      - name: VERSION is a semver
        run: |
          set -euo pipefail
          v="$(tr -d ' \t\n\r' < VERSION)"
          echo "VERSION = $v"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::VERSION must look like 1.2.3"; exit 1; }

  unit-tests:
    name: Unit tests (macOS, Python ${{ matrix.python-version }})
    runs-on: macos-latest
    # run.sh also stops any one suite after HERMES_TESTS_SUITE_TIMEOUT (600 s)
    # and reports it as FAIL by name; this caps the job (E137)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The owner's own Mac (and its dashboard) runs Python 3.14 — see
        # CLAUDE.md — so CI must cover the version actually in use, not
        # whatever was newest when this file was written. 3.13 stays in the
        # matrix as the previous stable series; drop it once 3.14 has been
        # green here for a while. 3.12 is the oldest Python the repo supports
        # (aux_config's zoneinfo validation and the framework Python the
        # launchd scripts fall back to), so it is tested too (C85).
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # run.sh's own model-wake guard only compares before/after WITHIN one
      # run.sh invocation, so a runner that somehow already had a lane
      # resident (a leftover from something else on a self-hosted box, say)
      # would still read as "unchanged" if a test left it running too.
      # Snapshot it here as an independent, job-level check.
      - name: Snapshot model processes before the run
        run: |
          set -uo pipefail
          before="$(pgrep -f 'mlx-vlm-launc[h]|mlx_lm[ ]server' | tr '\n' ' ' || true)"   # pgrep exits 1 when nothing matches; the runner's bash -e must not treat that as failure
          echo "MODELS_BEFORE=$before" >> "$GITHUB_ENV"
          if [ -n "$before" ]; then
            echo "::error::a model server is already resident before the run started"
            pgrep -fl 'mlx-vlm-launc[h]|mlx_lm[ ]server'
            exit 1
          fi
          echo "clean (before)"

      # The unit tier is the only tier that may run here: it stubs the dashboard
      # modules against throwaway HOMEs, and run.sh loads an offline guard that
      # refuses the dashboard / model / serve ports for the whole tier, so a
      # suite that quietly needed the owner's running Mac fails instead of
      # passing by accident.  live/, browser/ and ac/ need a real machine.
      # HERMES_TESTS_STRICT=1 makes a missing offline guard a hard failure
      # instead of a warning — GitHub Actions already sets CI=true, which
      # run.sh treats the same way, but this is explicit in case that ever
      # changes or the job runs somewhere else.
      # Skips are counted, never credited (C83): with FAIL_ON_SKIP every skip
      # that is not listed here fails the job, so CI cannot quietly run a
      # smaller suite than the owner's Mac. Each entry is a check that needs
      # the owner's own ~/.hermes, which a fresh runner does not have. A new
      # suite that skips here adds its line in the same change (see
      # tools/tests/README.md "Skips and CI").
      - name: Run the unit tier
        env:
          HERMES_TESTS_STRICT: "1"
          HERMES_TESTS_FAIL_ON_SKIP: "1"
          HERMES_TESTS_EXPECTED_SKIPS: |
            t_132_branch.py: no ~/.hermes/hermes-agent
            t_c111_approval_gate.py: no Hermes install
            t_c130_model_server_lockdown.py: no mlx-vlm venv
            t_c130_model_server_lockdown.py: no python with mlx_lm
            t_c36_unattended_toolsets.py: no Hermes checkout
            t_r3_roster_catalog.py: no mlx-vlm venv
            t_r3_roster_launcher.py: no mlx-vlm venv
            t_r3_roster_launcher.py: no python with mlx_lm
        run: |
          set -euo pipefail
          node --version
          python3 --version
          tools/tests/run.sh unit

      - name: No model server was started
        run: |
          set -uo pipefail
          after="$(pgrep -f 'mlx-vlm-launc[h]|mlx_lm[ ]server' | tr '\n' ' ' || true)"   # pgrep exits 1 when nothing matches; the runner's bash -e must not treat that as failure
          before="${MODELS_BEFORE:-}"
          if [ "$after" != "$before" ]; then
            echo "::error::a model server's presence changed during the run (before=[${before:-none}] after=[${after:-none}])"
            pgrep -fl 'mlx-vlm-launc[h]|mlx_lm[ ]server' || true
            exit 1
          fi
          echo "clean"

  # The Swift shell (app/main.swift) and its helpers are only ever compiled by
  # app/build-app.sh on the owner's Mac or by release.yml at tag time, so a
  # type error used to surface for the first time inside a release (C85).
  # -typecheck builds nothing and signs nothing.
  swift-typecheck:
    name: Swift typecheck (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Typecheck the app and its helpers
        run: |
          set -euo pipefail
          swiftc --version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          echo "swiftc -typecheck app/main.swift"
          swiftc -typecheck app/main.swift
          echo "swiftc -typecheck app/render-icon.swift"
          swiftc -typecheck app/render-icon.swift
          # the dictation helper uses SpeechAnalyzer (macOS 26 SDK), behind
          # availability checks for its 14.0 deployment target
          if [ "${sdk%%.*}" -ge 26 ]; then
            echo "swiftc -typecheck app/dictation/main.swift"
            swiftc -typecheck -target "$(uname -m)-apple-macosx14.0" app/dictation/main.swift
          else
            echo "::warning::app/dictation/main.swift needs the macOS 26 SDK (SpeechAnalyzer); this runner has $sdk, so it was not typechecked"
          fi
