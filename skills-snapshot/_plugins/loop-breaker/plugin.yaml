name: loop-breaker
version: 1.0.0
description: "Hard guard against degenerate tool-call loops — blocks the 3rd+ identical tool call (same name + same args) within a turn, so the agent can't waste iterations re-issuing the same search/command. Nudges it to vary or conclude."
author: "Hermes Assistant (local)"
hooks:
  - pre_tool_call
  - on_session_end
